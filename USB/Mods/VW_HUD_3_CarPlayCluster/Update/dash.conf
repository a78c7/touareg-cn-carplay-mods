# 仪表信息框设置（v19）。连接 CarPlay、仪表显示地图时，叠在地图上的半透明小框：
# 左边框在左下角挡位框上方，右边框（v19 新增）在右下角车速框上方，两个框分别选择项目和顺序。
# 推荐用 U 盘根目录的「改装设置」程序来选，不用手改本文件。改完重新刷 U 盘（本文件每次安装都会覆盖车上的同名文件）。
#
# items = 左边框要显示的项目，从上到下的顺序，用英文逗号分隔，最多 10 项（第 11 项起忽略）。
#         字号按项数自动选：1～6 项大字，7～8 项中字，9～10 项小字（小字在仪表上偏小，建议不超过 8 项）。
#         可以写英文名或中文名（中文名不用写空格）。不想要左边框：show=0
# r_items / r_show = 右边框的项目和开关，写法同上（默认不显示）。
#         两个框都显示时字号和高度都一样（按项目多的那个框，项目少的框下面留空），左右对称。
#
#   英文名        中文名（同大众叫法）  单位        说明
#   power         功率                  kW          发动机当前输出功率
#   torque        扭矩                  Nm          发动机当前扭矩
#   g             G值                   g           合成加速度（纵向+横向），加速带 +、刹车带 -，只转弯不带符号
#   glong         纵向G                 g           纵向加速度，+ 加速 / - 刹车
#   glat          横向G                 g           横向加速度（转弯），左右符号以车上数据为准，反了可设 lat_flip=1
#   rpm           转速                  rpm
#   speed         车速                  km/h
#   pedal         油门                  %           油门踏板开度
#   brake         制动压力              bar
#   steer         转向角                °           方向盘转角（越野显示里的"转向角"）
#   gear          挡位                              P/R/N/D1-8/S1-8/M1-8（仪表左下角本来就有）
#   gearbox       变速箱油温            °C
#   oil           机油温度              °C
#   coolant       冷却液温度            °C
#   outside       车外温度              °C
#   cons          当前消耗              L/100km     停车时自动变成 L/h
#   fuel          燃油存量              L           油箱剩余升数 = 油量百分比 × tank_l
#   range         续驶里程              km
#
#   行驶数据三个存储器（和仪表"行驶数据"同名，框里分两行显示：上面小字是存储器，下面是项目）：
#   trip          自启动起平均消耗      L/100km     熄火超过 2 小时后重新开始
#   tripdist      自启动起行驶里程      km
#   tripspeed     自启动起平均车速      km/h
#   triptime      自启动起行驶时间      h           时:分
#   refuel        自上次加油起平均消耗  L/100km     加油后自动清零
#   refueldist    自上次加油起行驶里程  km
#   refuelspeed   自上次加油起平均车速  km/h
#   refueltime    自上次加油起行驶时间  h
#   total         累计平均消耗          L/100km     可在车机里手动清零
#   totaldist     累计行驶里程          km
#   totalspeed    累计平均车速          km/h
#   totaltime     累计行驶时间          h
#
#   性能（v18，需要「导航上 HUD」也是 v18）：
#   t100          0-100                 s           百公里加速：起步后显示计时，过 100 km/h 显示成绩（从静止起步才计时）
#   pmax          最大功率              kW          车机开机以来的最大值
#   tqmax         最大扭矩              Nm          车机开机以来的最大值
#   gmax          最大G值               g           车机开机以来的最大合成加速度
#   tripkm        Trip                  km          仪表"行驶数据"里的 Trip 里程（v19.2）。仪表不把它发给车机，所以用总里程推算：
#                                                   Trip = 总里程 - trip_base。trip_base 填 Trip 清零那一刻的总里程
#                                                   （或者：现在的总里程 - 现在仪表上的 Trip）；不填则显示 -
#
items=power,torque,g,rpm,oil,gearbox
show=1

# 右边框：例如 r_items=t100,pmax,tqmax,gmax 再把 r_show 改成 1
r_items=
r_show=0

# 位置（仪表画面像素）：x,y = 框的左上角，right = 框的右边缘（框宽 = right - x，按宽度自动收紧字距）
# 左边框默认在仪表顶部导航条下面，右边缘对齐左下角挡位框的斜角
x=5
y=164
right=300
# 右边框默认和左边框左右对称，右边缘离屏幕右边 5 像素
r_x=1620
r_y=164
r_right=1915
# 背景不透明度 0-255（两个框一样；要不一样可以另写 r_alpha）
alpha=200
# 油箱容积（升），用于"燃油存量"换算；设 0 显示百分比
tank_l=90
# 横向G 符号反转：0 不反转，1 反转
lat_flip=0
# Trip 起点（总里程，km），见上面 tripkm 的说明；0 = 未设置
trip_base=0

# ---- 仪表 CarPlay 地图的车标位置（v19.2，和信息框无关，放在这里是因为本文件每次刷机都会更新）----
# car_up：整张地图上移多少行（0～90）。车标被仪表底部的驾驶辅助图案挡住时调大
car_up=35
# acc_up：开自适应巡航（ACC）时再上移多少行（0～90，0 = 不移）。car_up + acc_up 最多 90
acc_up=80
# amap_turn：高德转向补偿。0 关（默认）：高德导航时自己会把车标往目的地那一侧挪约 213 像素（仪表上约 3 厘米），
#            车机拿不到目的地方向，按路口方向补偿只是碰巧对，所以默认不补偿；
#            1 开（按下一个路口的方向补偿，v19.2 以前的做法）；2 自动（同 1，但收到车道信息就不补偿）；
#            3 看画面（试验）：每秒在仪表画面里找高德车标，偏了就换安全区，把车标放回时钟下方
amap_turn=0
