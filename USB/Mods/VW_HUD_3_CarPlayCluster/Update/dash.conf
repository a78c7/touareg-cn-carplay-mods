# 仪表信息框设置（v17）。连接 CarPlay、仪表显示地图时，地图左侧的半透明小框。
# 改完重新刷 U 盘（本文件每次安装都会覆盖车上的同名文件），或 SSH 改 /mnt/app/eso/bin/apps/cluster/dash.conf 后重连 CarPlay。
#
# items = 要显示的项目，从上到下的顺序，用英文逗号分隔，最多 10 项（7 项及以上自动换小字号）。
#         可以写英文名或中文名。不想要信息框：show=0
#
#   英文名      中文名       单位        说明
#   power       功率         kW          发动机当前输出功率
#   torque      扭矩         Nm          发动机当前扭矩
#   g           G值          g           合成加速度（纵向+横向），加速带 +、刹车带 -，只转弯不带符号
#   glong       纵向G        g           纵向加速度，+ 加速 / - 刹车
#   glat        横向G        g           横向加速度（转弯），左右符号以车上数据为准，反了可设 lat_flip=1
#   rpm         转速         rpm
#   speed       车速         km/h
#   pedal       油门         %           油门踏板开度
#   brake       刹车         bar         刹车压力
#   steer       方向盘       °           方向盘角度
#   gear        挡位                     P/R/N/D1-8/S1-8/M1-8（仪表左下角本来就有）
#   gearbox     变速箱       °C          变速箱油温
#   oil         机油         °C          机油温度
#   coolant     冷却液       °C          冷却液温度
#   outside     外温         °C          车外温度
#   cons        瞬时油耗     L/100km     停车时自动变成 L/h
#   trip        本程油耗     L/100km     行车电脑"自启动起"的平均油耗
#   refuel      加油后油耗   L/100km     行车电脑"自加油起"的平均油耗
#   fuel        油量         L           油箱剩余升数 = 油量百分比 × tank_l
#   range       续航         km
#   tripdist    本程里程     km          "自启动起"里程
#   tripspeed   平均车速     km/h        "自启动起"平均车速
#   triptime    行驶时间     h           "自启动起"行驶时间（时:分）
#
items=power,torque,g,rpm,oil,gearbox

# 位置（仪表画面像素，左上角）：默认在仪表顶部导航条和左下角挡位框之间
x=40
y=172
# 背景不透明度 0-255
alpha=200
# 油箱容积（升），用于"油量"换算；设 0 显示百分比
tank_l=90
# 横向G 符号反转：0 不反转，1 反转
lat_flip=0
