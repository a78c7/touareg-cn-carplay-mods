# CarPlay cluster settings (v15+). Read at every CarPlay connect; /tmp/cl.conf, if present, is used instead.
# (the info box on the cluster map is configured in dash.conf since v17)
# tall/croptop: phone sees a 1920x960 cluster, rows 230..869 are shown (car sits lower on the panel)
# area=x,y,w,h : safe areas (index 0,1,2...), rule=<app name part>,<1 navigating|0|*>,<area index>
# target point: x 959 (under the cluster clock; 965 measured from a photo at first, moved 6 px left after on-car checks: the car sat ~6 px right of the centre of the cluster's bottom panel), shown row 556
va=1
tall=960
croptop=230
# v19.2: while adaptive cruise control (ACC) is on, move the map (and the car icon) up by this many rows so the
# car clears the ACC symbol at the bottom of the cluster (0 = off; at most 960-640-croptop = 90 with the values above)
acc_up=80
ui=-1
# v19.5 (testing, read at CarPlay connect): wide=W tells the phone the cluster is W px wide (1920..2880); the shown
# window is taken from the middle of it and can slide left/right by itself (AMap car icon, no phone redraw) when
# W >= 2352. view=P shows the canvas at P percent (60..100): less than 100 = more map ahead, everything smaller,
# needs a wider canvas (view 85 -> wide >= 2688). anchor_y = shown row of the car target (default 556).
#wide=2400
#view=100
area=4,0,1910,960
area=559,706,800,160
area=559,706,800,160
area=394,706,800,160
area=499,706,800,160
area=459,706,800,160
area=374,706,800,160
area=334,706,800,160
area=144,0,1770,960
area=244,0,1670,960
area=344,0,1570,960
area=444,0,1470,960
area=619,706,800,160
area=449,0,1440,960
area=0,0,1498,960
# AMap moves the car ~210 px toward the next turn: use area 13 before a left turn, 14 before a right turn
turn=高德,13,14
rule=高德,1,0
rule=百度,1,3
rule=Apple,*,2
rule=*,*,1
