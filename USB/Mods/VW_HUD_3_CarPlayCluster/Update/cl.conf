# CarPlay cluster settings (v15). Read at every CarPlay connect; /tmp/cl.conf, if present, is used instead.
# tall/croptop: phone sees a 1920x960 cluster, rows 230..869 are shown (car sits lower on the panel)
# area=x,y,w,h : safe areas (index 0,1,2...), rule=<app name part>,<1 navigating|0|*>,<area index>
# target point: x 965 (under the cluster clock, measured from a photo), shown row 556
va=1
tall=960
croptop=230
ui=-1
area=10,0,1910,960
area=565,706,800,160
area=565,706,800,160
area=400,706,800,160
area=505,706,800,160
area=465,706,800,160
area=380,706,800,160
area=340,706,800,160
area=150,0,1770,960
area=250,0,1670,960
area=350,0,1570,960
area=450,0,1470,960
area=625,706,800,160
area=455,0,1440,960
area=0,0,1510,960
# AMap moves the car ~210 px toward the next turn: use area 13 before a left turn, 14 before a right turn
turn=高德,13,14
rule=高德,1,0
rule=百度,1,3
rule=Apple,*,2
rule=*,*,1
