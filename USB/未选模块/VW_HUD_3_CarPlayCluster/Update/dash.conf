# 仪表信息框设置（v22.01 大字运动刻度 + 平滑阻尼版）。连接 CarPlay、仪表显示地图时，叠在地图上的半透明信息卡：
# 左边框默认对齐左下角挡位框斜边（x=5..300），右边框对齐右下角车速框斜边，左右字号独立自适应，互不拖累。
# 推荐用 U 盘根目录的「改装设置」程序或车机 8080 无线控制台来选，不用手改本文件。
#
# items = 左边框要显示的项目，从上到下的顺序，用英文逗号分隔，最多 10 项（第 11 项起忽略）。
#         字号按单框项数独立自动选：1～5 项特大粗体（46px 数字），6 项大号粗体（41px 数字），7～8 项中号，9～10 项紧凑。
#         建议每侧不超过 5～6 项，行车余光一瞥即读。不想要左边框：show=0
# r_items / r_show = 右边框的项目和开关，写法同上（默认不显示常驻右框，导航时自动弹出大字导航卡）。
# bars = 动态刻度进度条开关（1 开启，0 关闭）：
#        • 转速 / 功率 / 扭矩 / 油门 / 制动：斜切平行四边形分段运动条（冰青 → 琥珀 → 暗红底红线区）
#        • G 值 / 纵向G / 横向G / 转向角 / 俯仰角 / 侧倾角：居中零点双向滑块条
#        • 机油温度 / 变速箱油温 / 冷却液温度 / 胎压 / 燃油存量：连续区间状态条（低温蓝 / 适温青绿 / 高温红）
#
#   英文名        中文名                单位        说明
#   power         功率                  kW          发动机当前输出功率
#   torque        扭矩                  Nm          发动机当前扭矩
#   g             G 值                  g           合成加速度（纵向+横向），加速带 +、刹车带 -，只转弯不带符号
#   glong         纵向 G                g           纵向加速度，+ 加速 / - 刹车
#   glat          横向 G                g           横向加速度（转弯），左右符号反了可设 lat_flip=1
#   rpm           转速                  rpm
#   speed         车速                  km/h
#   pedal         油门                  %           油门踏板开度
#   brake         制动压力              bar
#   steer         转向角                °           方向盘转角
#   gear          挡位                              P/R/N/D1-8/S1-8/M1-8（ZF 8HP65A 齿比实时标定）
#   gearbox       变速箱油温            °C
#   oil           机油温度              °C
#   coolant       冷却液温度            °C
#   outside       车外温度              °C
#   cons          当前消耗              L/100km     停车时自动变成 L/h
#   fuel          燃油存量              L           油箱剩余升数 = 油量百分比 × tank_l
#   range         续驶里程              km
#
#   行驶数据三个存储器（单行直显粗体中文名）：
#   trip          本次油耗              L/100km     熄火超过 2 小时后重新开始
#   tripdist      本次里程              km
#   tripspeed     本次均速              km/h
#   triptime      本次时长              h           时:分
#   refuel        加油后油耗            L/100km     加油后自动清零
#   refueldist    加油后里程            km
#   refuelspeed   加油后均速            km/h
#   refueltime    加油后时长            h
#   total         累计油耗              L/100km     可在车机里手动清零
#   totaldist     累计里程              km
#   totalspeed    累计均速              km/h
#   totaltime     累计时长              h
#
#   性能（需要「导航上 HUD」同步安装）：
#   t100          0–100                 s           百公里加速：从静止起步自动计时，过 100 km/h 锁定成绩
#   pmax          最大功率              kW          车机开机以来的最大值
#   tqmax         最大扭矩              Nm          车机开机以来的最大值
#   gmax          最大 G 值             g           车机开机以来的最大合成加速度
#   tripkm        Trip                  km          仪表 Trip 里程（Trip = 总里程 - trip_base；不填显示 -）
#
#   胎压与越野姿态（v21.0 真实物理传感器数据，需要「导航上 HUD」v21.0）：
#   tires         四轮胎压              bar         单行展示前桥均值·后桥均值胎压（如 2.2·2.1，报警附 !）
#   tpfl          左前胎压              bar         左前轮胎压（车机报胎压异常时后附 !）
#   tpfr          右前胎压              bar         右前轮胎压
#   tprl          左后胎压              bar         左后轮胎压
#   tprr          右后胎压              bar         右后轮胎压
#   pitch         俯仰角                °           车身前后俯仰坡度角（+ 上坡抬头 / - 下坡低头）
#   roll          侧倾角                °           车身左右侧倾角
#   alt           海拔                  m           原车 GNSS 海拔高度
#
items=power,torque,g,rpm,oil,gearbox
show=1
bars=1
# smooth = 运动条阻尼平滑动画（1 开启，0 关闭；配合 10Hz 遥测消除阶跃跳格）
smooth=1

# 右边框：例如 r_items=tripdist,tripspeed,cons,trip,refueldist,tripkm 再把 r_show 改成 1
r_items=
r_show=0

# 位置（仪表画面像素）：x,y = 框的左上角，right = 框的右边缘（框宽 = right - x）
# 左边框默认在仪表顶部导航条下面，右边缘对齐左下角挡位框的斜角（x=5..300）
x=5
y=164
right=300
# 右边框默认和左边框左右对称，右边缘离屏幕右边 5 像素
r_x=1620
r_y=164
r_right=1915
# 背景不透明度 0-255（两个框一样；要不一样可以另写 r_alpha）
alpha=200
# 油箱容积（升），用于"燃油存量"换算；设 0 显示百分比
tank_l=90
# 横向G 符号反转：0 不反转，1 反转
lat_flip=0
# Trip 起点（总里程，km），见上面 tripkm 的说明；0 = 未设置
trip_base=0

# ---- 仪表 CarPlay 地图的车标位置 ----
# car_up：整张地图上移多少行（0～90）。车标被仪表底部的驾驶辅助图案挡住时调大
car_up=35
# acc_up：开自适应巡航（ACC）时再上移多少行（0～90，0 = 不移）。car_up + acc_up 最多 90
acc_up=80
# amap_turn：高德车标位置（只对高德生效，苹果地图、百度不受影响）：
#            3 看画面自动居中（默认推荐）；0 关；1 按下一个路口方向补偿；2 同 1，收到车道信息就不补偿
amap_turn=3

# ---- 大字导航信息卡 ----
# nav_box：导航信息卡显示模式（默认左右对称 295px 宽，与左框对齐）：
#          0 关闭；1 仅导航时自动弹出（默认，退出导航自动切回对应侧信息框）；2 常驻显示（未导航时显示待机导航框）
nav_box=1
# nav_side：导航信息卡显示位置（right 放右信息框位置，默认；left 放左信息框位置）
nav_side=right
# nav_tz：预计到达时间（ETA）时区偏移（整数，默认 8 = 北京时间 UTC+8）
nav_tz=8
