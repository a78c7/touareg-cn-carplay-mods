# Publish a Release from main: Actions tab -> release -> Run workflow (enter the version, e.g. v22.02), or
#   gh workflow run release.yml --repo a78c7/touareg-cn-carplay-mods -f tag=v22.02
# (pushing a version tag also works). GitHub tests & cross-builds the configurator from source,
# signs the offline OTA .tar with Ed25519 (requires repository secret OTA_SIGNING_KEY),
# packs USB + licenses (tools/make_release.sh), and uploads .zip, .tar, and SHA256SUMS.txt.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'version, e.g. v22.02'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install llvm-lipo for macOS universal binary
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: Build & verify configurator from source
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: sh tools/configurator/build.sh "${TAG}"
      - name: Pack USB folder, Ed25519-signed OTA & SHA256SUMS
        run: sh tools/make_release.sh "${TAG}"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          OTA_SIGNING_KEY_PEM: ${{ secrets.OTA_SIGNING_KEY }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          awk -v t="## $TAG" '$0==t{f=1;next} /^## /{f=0} f' RELEASE_NOTES.md > notes.md 2>/dev/null || true
          printf '\n- **首次安装**：下载 `touareg-cn-carplay-mods-%s.zip`，解压全部内容到 FAT32 U 盘根目录，**先运行「改装设置」勾选模块并保存**再上车刷入。\n- **已装无线控制台升级**：直接下载 `touareg-ota-%s.tar`，连热点打开 `http://touareg.local:8080` → 开关运维 → 离线无线升级（官方 Ed25519 签名 + SHA-256 校验 + 自动备份回滚）。\n- **完整性校验**：下载 `SHA256SUMS.txt` 可核对全部发布产物哈希。\n' "$TAG" "$TAG" >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "touareg-cn-carplay-mods-$TAG.zip" "touareg-ota-$TAG.tar" "SHA256SUMS.txt" --clobber
          else
            gh release create "$TAG" "touareg-cn-carplay-mods-$TAG.zip" "touareg-ota-$TAG.tar" "SHA256SUMS.txt" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md --latest
          fi
