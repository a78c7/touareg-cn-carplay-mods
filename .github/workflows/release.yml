# Publish a Release from main: Actions tab -> release -> Run workflow (enter the version, e.g. v18.1), or
#   gh workflow run release.yml --repo a78c7/touareg-cn-carplay-mods -f tag=v18.1
# (pushing a version tag also works). GitHub packs the USB folder (tools/make_release.sh) and attaches
# touareg-cn-carplay-mods-<tag>.zip (download counts are shown per asset).
# Release notes: RELEASE_NOTES.md (the section for this tag, if present) + a pointer to the README.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'version, e.g. v18.1'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pack USB folder
        run: sh tools/make_release.sh "${TAG}"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          awk -v t="## $TAG" '$0==t{f=1;next} /^## /{f=0} f' RELEASE_NOTES.md > notes.md 2>/dev/null || true
          printf '\n下载 `touareg-cn-carplay-mods-%s.zip`，解压后把里面的全部内容复制到 FAT32 U 盘根目录，按 README 安装。\n' "$TAG" >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "touareg-cn-carplay-mods-$TAG.zip" --clobber
          else
            gh release create "$TAG" "touareg-cn-carplay-mods-$TAG.zip" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md --latest
          fi
