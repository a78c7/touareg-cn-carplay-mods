# Publish a Release from main: Actions tab -> release -> Run workflow (enter the version, e.g. v21.0.1), or
#   gh workflow run release.yml --repo a78c7/touareg-cn-carplay-mods -f tag=v21.0.1
# (pushing a version tag also works). GitHub tests & cross-builds the configurator, packs USB + licenses
# (tools/make_release.sh), and attaches touareg-cn-carplay-mods-<tag>.zip.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'version, e.g. v21.0.1'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install llvm-lipo for macOS universal binary
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: Build & verify configurator from source
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: sh tools/configurator/build.sh "${TAG}"
      - name: Pack USB folder and license notices
        run: sh tools/make_release.sh "${TAG}"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          awk -v t="## $TAG" '$0==t{f=1;next} /^## /{f=0} f' RELEASE_NOTES.md > notes.md 2>/dev/null || true
          printf '\n- **首次安装**：下载 `touareg-cn-carplay-mods-%s.zip`，解压全部内容到 FAT32 U 盘根目录，**先运行「改装设置」勾选模块并保存**再上车刷入。\n- **已装 v22.0+ 无线控制台升级**：直接下载 `touareg-ota-%s.tar`，连热点打开 `http://touareg.local:8080` → 开关运维 → 离线无线升级（SHA-256 校验 + 自动备份回滚）。\n' "$TAG" "$TAG" >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "touareg-cn-carplay-mods-$TAG.zip" "touareg-ota-$TAG.tar" --clobber
          else
            gh release create "$TAG" "touareg-cn-carplay-mods-$TAG.zip" "touareg-ota-$TAG.tar" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md --latest
          fi
