<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 210" width="840" height="210" fill="none" role="img" aria-label="MH2p CarPlay and Cockpit Mod Architecture">
  <defs>
    <marker id="arr-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Column 1: iPhone -->
  <rect x="10" y="14" width="194" height="182" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
  <text x="24" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#e6edf3">iPhone</text>
  <text x="190" y="33.5" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">USB / Wi-Fi</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <rect x="20" y="46" width="174" height="42" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="30" y="64" font-size="11.5" font-weight="600" fill="#e6edf3">AirPlay H.264</text>
    <text x="30" y="79" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">1920×639 · 1540×720</text>

    <rect x="20" y="96" width="174" height="42" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="30" y="114" font-size="11.5" font-weight="600" fill="#e6edf3">iAP2 Route Guidance</text>
    <text x="30" y="129" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">Turn · Road · Lane · ETA</text>

    <rect x="20" y="146" width="174" height="42" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="30" y="164" font-size="11.5" font-weight="600" fill="#e6edf3">Personal Hotspot</text>
    <text x="30" y="179" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#8b949e">Web :8080 · SSH :2012</text>
  </g>

  <!-- Connectors: iPhone -> MH2p -->
  <line x1="204" y1="67" x2="241" y2="67" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#arr-d)"/>
  <line x1="204" y1="117" x2="241" y2="117" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#arr-d)"/>
  <line x1="204" y1="167" x2="241" y2="167" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#arr-d)"/>

  <!-- Column 2: MH2p Head Unit (QNX 6.6) -->
  <rect x="244" y="14" width="352" height="182" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.4"/>
  <text x="258" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#e6edf3">MH2p Head Unit</text>
  <rect x="524" y="21" width="60" height="18" rx="9" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-width="0.9"/>
  <text x="554" y="33.2" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="600" fill="#58a6ff">QNX 6.6</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <!-- Row 1 -->
    <rect x="254" y="46" width="161" height="42" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="264" y="64" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600" fill="#e6edf3">cl_probe.so</text>
    <text x="264" y="79" font-size="10" fill="#8b949e">H.264 &amp; iAP2 capture</text>

    <rect x="425" y="46" width="161" height="42" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="435" y="64" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600" fill="#e6edf3">cl_render + clusterd</text>
    <text x="435" y="79" font-size="10" fill="#8b949e">GLES2 60fps · QuickJS</text>

    <!-- Row 2 -->
    <rect x="254" y="96" width="161" height="42" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="264" y="114" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.2" font-weight="600" fill="#e6edf3">VWClusterNav + B98</text>
    <text x="264" y="129" font-size="10" fill="#8b949e">DSI telemetry · Bundle 98</text>

    <rect x="425" y="96" width="161" height="42" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="435" y="114" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600" fill="#e6edf3">touareg_netd</text>
    <text x="435" y="129" font-size="10" fill="#8b949e">Web :8080 · Ed25519 OTA</text>

    <!-- Row 3 -->
    <rect x="254" y="146" width="332" height="42" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="264" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600" fill="#e6edf3">vhpatch</text>
    <text x="264" y="179" font-size="10" fill="#8b949e">skin3 viewhandler patch · Fullscreen CarPlay canvas</text>
  </g>

  <!-- Connectors: MH2p -> Vehicle Displays -->
  <line x1="596" y1="41" x2="633" y2="41" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#arr-d)"/>
  <line x1="596" y1="105" x2="633" y2="105" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#arr-d)"/>
  <line x1="596" y1="169" x2="633" y2="169" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#arr-d)"/>

  <!-- Column 3: Vehicle Outputs -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <rect x="636" y="14" width="194" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
    <text x="648" y="36" font-size="12" font-weight="700" fill="#e6edf3">12&quot; Digital Cockpit</text>
    <text x="648" y="54" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.8" fill="#58a6ff">1920×639 Map + 60fps</text>

    <rect x="636" y="78" width="194" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
    <text x="648" y="100" font-size="12" font-weight="700" fill="#e6edf3">Head-Up Display (HUD)</text>
    <text x="648" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.8" fill="#8b949e">Turn · Distance · Lane</text>

    <rect x="636" y="142" width="194" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
    <text x="648" y="164" font-size="12" font-weight="700" fill="#e6edf3">15&quot; Fullscreen Display</text>
    <text x="648" y="182" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.8" fill="#58a6ff">1920×1020 Fullscreen</text>
  </g>
</svg>
