<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 72" width="420" height="72" fill="none" role="img" aria-label="VW Touareg CR7 Innovision Cockpit — 12-inch Digital Cockpit and 15-inch Discover Premium">
  <!-- 12" Digital Cockpit (left) -->
  <rect x="30" y="12" width="164" height="44" rx="5" stroke="#e6edf3" stroke-width="1.6"/>
  <rect x="35.5" y="16.5" width="153" height="35" rx="2.5" stroke="#6e7681" stroke-width="0.9"/>
  <!-- Top OEM status hairline -->
  <line x1="40" y1="21" x2="184" y2="21" stroke="#6e7681" stroke-width="0.7" stroke-opacity="0.7"/>
  <!-- Left telemetry box outline -->
  <rect x="39" y="24" width="29" height="21" rx="2" fill="#58a6ff" fill-opacity="0.1" stroke="#e6edf3" stroke-width="1"/>
  <line x1="43" y1="29" x2="63" y2="29" stroke="#58a6ff" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="43" y1="34.5" x2="59" y2="34.5" stroke="#6e7681" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="43" y1="40" x2="55" y2="40" stroke="#6e7681" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Right nav card outline -->
  <rect x="156" y="24" width="29" height="21" rx="2" fill="#58a6ff" fill-opacity="0.1" stroke="#e6edf3" stroke-width="1"/>
  <path d="M163 35 V29.5 H170 M167.5 27.5 L170.5 29.5 L167.5 31.5" stroke="#58a6ff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="162" y1="39.5" x2="179" y2="39.5" stroke="#6e7681" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Center cluster map + active route -->
  <path d="M84 48 L92 24 M140 48 L132 24 M76 35 H148" stroke="#6e7681" stroke-width="0.65" stroke-opacity="0.5"/>
  <path d="M112 45 V33 C112 31.3 113.3 30 115 30 H132" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M129 27.3 L133.2 30 L129 32.7" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="112" cy="45" r="2.3" fill="#58a6ff"/>
  <!-- OEM bottom corner slant accents -->
  <path d="M36 47.5 H53 L58.5 51.5" stroke="#6e7681" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M188 47.5 H171 L165.5 51.5" stroke="#6e7681" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Innovision Cockpit miter crease connecting 12" and 15" -->
  <path d="M194 12 L209 8 M194 56 L209 56" stroke="#6e7681" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="201.5" y1="12" x2="201.5" y2="54" stroke="#6e7681" stroke-width="0.85" stroke-dasharray="2 2.5"/>

  <!-- 15" Discover Premium (right, fullscreen CarPlay) -->
  <rect x="209" y="8" width="181" height="48" rx="5" stroke="#e6edf3" stroke-width="1.6"/>
  <rect x="215" y="13" width="169" height="38" rx="2.5" stroke="#6e7681" stroke-width="0.9"/>
  <!-- CarPlay left dock -->
  <line x1="230.5" y1="14.5" x2="230.5" y2="49.5" stroke="#6e7681" stroke-width="0.8"/>
  <rect x="219.5" y="17.5" width="6.5" height="6.5" rx="1.6" stroke="#58a6ff" stroke-width="1.1"/>
  <rect x="219.5" y="27" width="6.5" height="6.5" rx="1.6" stroke="#e6edf3" stroke-width="1"/>
  <rect x="219.5" y="36.5" width="6.5" height="6.5" rx="1.6" stroke="#6e7681" stroke-width="1"/>
  <!-- Fullscreen CarPlay map canvas -->
  <path d="M236 37 L278 24 L334 39 L379 22 M268 15 L259 49 M328 15 L344 49" stroke="#6e7681" stroke-width="0.7" stroke-opacity="0.5"/>
  <rect x="237.5" y="17" width="44" height="12.5" rx="2.2" fill="#58a6ff" fill-opacity="0.1" stroke="#e6edf3" stroke-width="0.9"/>
  <line x1="242" y1="23.2" x2="275" y2="23.2" stroke="#e6edf3" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M266 47 C276 38 294 35 314 33 C332 31 348 25 366 19.5" stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="366" cy="19.5" r="2.4" fill="#58a6ff"/>
  <circle cx="295" cy="34.5" r="4.5" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="295" cy="34.5" r="1.8" fill="#58a6ff"/>

  <!-- Minimalist technical captions (no version numbers) -->
  <g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="8.5" font-weight="500" letter-spacing="0.9" fill="#6e7681" text-anchor="middle">
    <text x="112" y="68">12&quot; DIGITAL COCKPIT</text>
    <text x="299.5" y="68">15&quot; DISCOVER PREMIUM</text>
  </g>
  <circle cx="201.5" cy="65.2" r="1.4" fill="#58a6ff"/>
</svg>
